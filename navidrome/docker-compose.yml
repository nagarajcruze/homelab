services:
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    user: 1000:1000
    ports:
      - 4533:4533
    restart: unless-stopped
    volumes:
      - ./data:/data
      - ./data/backup:/backup
      - /docker-cache/navidrome/cache:/data/cache
      - /mnt/tank/flacs:/music:ro
    environment:
      # Optional: put your config options customization here. Examples:
      ND_SCANSCHEDULE: 1h
      ND_LOGLEVEL: info
      ND_SESSIONTIMEOUT: 24h
      ND_DEFAULTTRANSCODINGFORMAT: aac
      ND_TRANSCODINGCACHE: "true"
      ND_TRANSCODINGCACHESIZE: 20GB
      ND_BACKUP_PATH: /backup
      ND_BACKUP_SCHEDULE: 0 0 * * 0
      ND_BACKUP_COUNT: 1
      ND_PLUGINS_ENABLED: true
      ND_PLUGINS_AUTORELOAD: true
      ND_DEVARTISTINFOTIMETOLIVE: 1s
      ND_AGENTS: lastfm,deezer
      ND_LISTENBRAINZ_ENABLED: false
networks:
  default:
    external: true
    name: homenet
