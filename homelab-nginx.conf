# ==============================================================================
# HOMELAB NGINX REVERSE PROXY CONFIG
# Routing Strategy: Port-Based (no domain required)
# All blocks use server_name _ to accept requests on any hostname/IP.
# ==============================================================================

# ------------------------------------------------------------------------------
# [Immich] Self-Hosted Photo & Video Backup
# Service Name: immich-server
# Access: http://<nginx-ip>:2283
# Notes: Large file upload support + WebSocket for mobile app sync
# ------------------------------------------------------------------------------
server {
    listen 2283;
    server_name _;

    # Allow large file uploads (photos/videos)
    client_max_body_size 50000M;

    # Disable upload buffering to prevent OOM on proxy and speed up uploads
    proxy_request_buffering off;

    # Increase body buffer to avoid throttling upload speed
    client_body_buffer_size 1024k;

    # Increase timeouts for large file transfers
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    send_timeout       600s;

    proxy_http_version 1.1;
    proxy_redirect     off;

    location / {
        proxy_pass http://immich-server:2283;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;

        # WebSocket support required for mobile app syncing
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ------------------------------------------------------------------------------
# [Jellyfin] Media Server
# Service Name: jellyfin
# Access: http://<nginx-ip>:8096
# ------------------------------------------------------------------------------
server {
    listen 8096;
    server_name _;

    location / {
        proxy_pass http://jellyfin:8096;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;

        # Disable buffering to avoid proxy resource exhaustion during streaming
        proxy_buffering off;
    }

    # WebSocket endpoint for Jellyfin real-time communication
    location /socket {
        proxy_pass http://jellyfin:8096;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
    }
}

# ------------------------------------------------------------------------------
# [qBittorrent] Torrent Download Client
# Service Name: qbittorrent
# Access: http://<nginx-ip>:6880
# Notes: Uses HTTP/1.1 with empty Connection header to avoid keep-alive issues
# ------------------------------------------------------------------------------
server {
    listen 6880;
    server_name _;

    location / {
        proxy_pass http://qbittorrent:6880;

        # qBittorrent requires the host header with port to avoid redirect loops
        proxy_set_header Host              $host:$server_port;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;

        proxy_http_version 1.1;
        # Empty Connection header disables keep-alive (required for qBittorrent WebUI)
        proxy_set_header Connection "";

        proxy_buffering off;
    }
}

# ------------------------------------------------------------------------------
# [Navidrome] Music Streaming Server
# Service Name: navidrome
# Access: http://<nginx-ip>:4533
# ------------------------------------------------------------------------------
server {
    listen 4533;
    server_name _;

    # Disable buffering for audio streaming
    proxy_buffering off;

    location / {
        proxy_pass http://navidrome:4533;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
    }
}

# Map HTTP Upgrade header for WebSocket support (used by blocks below)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ------------------------------------------------------------------------------
# [Grafana] Metrics & Monitoring Dashboards
# Service Name: grafana
# Access: http://<nginx-ip>:3000
# ------------------------------------------------------------------------------
server {
    listen 3000;
    server_name _;

    add_header X-Frame-Options "SAMEORIGIN";

    location / {
        add_header X-Robots-Tag "noindex, nofollow";

        proxy_pass http://grafana:3000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;

        # WebSocket support (required for Grafana live dashboards)
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }
}

