apiVersion: 1
groups:
  - orgId: 1
    name: ContainerAlerts
    folder: Infrastructure
    interval: 1m
    rules:
      # One alert instance per compose container. Seconds since cAdvisor last saw it (max by name, so
      # recreated containers with a new id count as up). The 7d window keeps a stopped container's
      # series alive so it stays firing; after 7d down it auto-resolves. Short restarts (<5m) never fire; for: 2m rides out the stale data right after a server reboot.
      # Suppressed while cAdvisor itself is down (scrape_target_down covers that).
      - uid: container_down
        title: Container Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: ffiut0kiqonpcd
            model:
              editorMode: code
              expr: '(time() - max by (name) (max_over_time(container_last_seen{name!="", container_label_com_docker_compose_project!=""}[7d]))) unless on() (up{job="cadvisor"} == 0)'
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            queryType: expression
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 300
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 2m
        isPaused: false
        annotations:
          summary: "Container {{ $labels.name }} is DOWN"
          description: "Container {{ $labels.name }} has not been seen for {{ humanizeDuration $values.A.Value }}."
        labels:
          severity: warning

      # Any exporter Prometheus can't scrape (cadvisor, node, smartctl, zfs_exporter, process-exporter).
      - uid: scrape_target_down
        title: Scrape Target Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: ffiut0kiqonpcd
            model:
              editorMode: code
              expr: up
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            queryType: expression
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 5m
        isPaused: false
        annotations:
          summary: "Scrape target {{ $labels.job }} ({{ $labels.instance }}) is DOWN"
          description: "Prometheus cannot scrape {{ $labels.job }} on {{ $labels.instance }}. Alerts depending on it are blind."
        labels:
          severity: critical

# Replaced by the dynamic container_down rule above
