apiVersion: 1
groups:
  - orgId: 1
    name: SMARTAlerts
    folder: Infrastructure
    interval: 1m
    rules:
      # 1. SMART Failed
      - uid: smart_status_failed
        title: SMART Device Status Failed
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: ffiut0kiqonpcd
            model:
              editorMode: code
              expr: smartctl_device_smart_status or smartctl_device_status
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            queryType: expression
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: eq
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 0s
        isPaused: false
        annotations:
          summary: "SMART status FAILED on {{ $labels.device }} ({{ $labels.instance }})"
          description: "Device {{ $labels.device }} on {{ $labels.instance }} has reported SMART status FAILED! Drive replacement recommended."
        labels:
          severity: critical

      # 2. HDD >45°C
