apiVersion: 1
groups:
  - orgId: 1
    name: FilesystemAlerts
    folder: Infrastructure
    interval: 1m
    rules:
      # ==========================================
      # 1. Mountpoint: / (Root)
      # ==========================================
      - uid: fs_root_space_warning
        title: Filesystem / Space Warning (>85%)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: ffiut0kiqonpcd
            model:
              editorMode: code
              expr: 100 * (1 - (node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay|squashfs"}))
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            queryType: expression
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 85
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 5m
        isPaused: false
        annotations:
          summary: "Filesystem / space warning on {{ $labels.instance }}"
          description: "Disk usage on mountpoint / is above 85% (current: {{ $values.A.Value }}%)"
        labels:
          severity: warning

