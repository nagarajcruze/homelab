        noDataState: NoData
        execErrState: Error
        for: 2m
        isPaused: false
        annotations:
          summary: "CRITICAL: Filesystem / disk full warning on {{ $labels.instance }}"
          description: "Disk usage on mountpoint / is above 95% (current: {{ $values.A.Value }}%)"
        labels:
          severity: critical

