services:
  joplin_db:
    image: postgres:16
    container_name: joplin_db
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DATABASE}
    volumes:
      - joplin_db:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime
    restart: always
  app:
    image: joplin/server:latest
    container_name: joplin_server
    environment:
      - APP_PORT=${APP_PORT:-22300}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:22300}
      - DB_CLIENT=${DB_CLIENT:-pg}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DATABASE=${POSTGRES_DATABASE}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_HOST=${POSTGRES_HOST:-joplin_db}
    depends_on:
      - joplin_db
    ports:
      - 22300:22300
    restart: unless-stopped
    volumes:
      - /etc/localtime:/etc/localtime
networks:
  default:
    external: true
    name: homenet
volumes:
  joplin_db:
    name: joplin_db
