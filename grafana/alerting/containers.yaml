apiVersion: 1
groups:
  - orgId: 1
    name: ContainerAlerts
    folder: Infrastructure
    interval: 1m
    rules:
      # Explicit rules for the 26 containers in homelab
      - uid: container_cadvisor_down
        title: Container cadvisor Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: ffiut0kiqonpcd
            model:
              editorMode: code
              expr: time() - container_last_seen{name="cadvisor"}
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            queryType: expression
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 30
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Error
        for: 1m
        isPaused: false
        annotations:
          summary: "cadvisor container is DOWN"
          description: "cadvisor monitoring container on {{ $labels.instance }} is not running."
        labels:
          severity: critical

